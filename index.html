<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaLB Pet Tracker</title>
  <style>
    /* Gotham Ultra fallback stack — if the font is installed system-wide it will load.
       Otherwise falls back to Impact / Arial Black for a similarly bold look. */
    @font-face {
      font-family: 'Gotham Ultra';
      src: local('Gotham Ultra'), local('GothamUltra'), local('Gotham-Ultra');
      font-weight: 900;
      font-style: normal;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ───────────────────── HEADER ───────────────────── -->
  <header id="hdr">
    <div class="logo">KICK A LUCKY BLOCK PET TRACKER</div>
    <div class="hstats">
      <div class="hst">
        <span class="hst-l">Active</span>
        <span class="hst-v" id="hs-act">0 / 30</span>
      </div>
      <div class="hst">
        <span class="hst-l">Rebirth</span>
        <div style="display: flex; align-items: center; gap: 0.3rem;">
          <button id="btn-rb-dec" class="btn-lvl" style="width: 16px; height: 16px; font-size: 0.55rem;">-</button>
          <span class="hst-v" id="hs-rb" style="color: var(--purp);">1</span>
          <button id="btn-rb-inc" class="btn-lvl" style="width: 16px; height: 16px; font-size: 0.55rem;">+</button>
        </div>
      </div>
      <div class="hst">
        <span class="hst-l">Daily earnings</span>
        <span class="hst-v" id="hs-tot">$0/d</span>
      </div>
      <button id="btn-theme" title="Alternar Tema">☀️</button>
      <button id="btn-exp">⬇ Export</button>
      <button id="btn-imp">⬆ Import</button>
      <input type="file" id="file-imp" accept=".json" style="display: none;">
      <button id="btn-ra">↺ Reset Everything</button>
    </div>
  </header>

  <!-- ───────────────────── APP ───────────────────── -->
  <div id="app">
    <aside id="sb">
      <div class="sec-title c-cyan"
        style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <span>Index</span>
        <div style="display: flex; gap: 0.3rem;">
          <select id="dict-mut"
            style="background: var(--bg3); border: 2px solid var(--b); color: var(--txt); font-family: var(--fb); font-weight: 900; font-size: .52rem; padding: .1rem .2rem; border-radius: var(--r); outline: none; cursor: pointer; max-width: 120px;"></select>
          <select id="dict-rarity"
            style="background: var(--bg3); border: 2px solid var(--b); color: var(--txt); font-family: var(--fb); font-weight: 900; font-size: .52rem; padding: .1rem .2rem; border-radius: var(--r); outline: none; cursor: pointer; max-width: 120px;">
            <option value="All">All Rarities</option>
            <option value="OG" style="color: #ff1000; font-weight: bold;">OG</option>
            <option value="Celestial" style="color: #f5cf00; font-weight: bold;">Celestial</option>
            <option value="Exclusive" style="color: var(--gold); font-weight: bold;">Exclusive</option>
          </select>
        </div>
      </div>
      <div id="dict"></div>
    </aside>
    <div id="sb-resizer"></div>

    <main id="main">
      <div class="sec-title c-purp" style="margin-bottom:1.1rem">Your plot</div>
      <div id="floors"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
