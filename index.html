<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Pet Placement Tracker</title>
  <style>
    /* Gotham Ultra fallback stack — if the font is installed system-wide it will load.
       Otherwise falls back to Impact / Arial Black for a similarly bold look. */
    @font-face {
      font-family: 'Gotham Ultra';
      src: local('Gotham Ultra'), local('GothamUltra'), local('Gotham-Ultra');
      font-weight: 900;
      font-style: normal;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ───────────────────── HEADER ───────────────────── -->
  <header id="hdr">
    <div class="logo">ROBLOX - KICK A LUCKY BLOCK - PET TRACKER</div>
    <div class="hstats">
      <div class="hst">
        <span class="hst-l">Activos</span>
        <span class="hst-v" id="hs-act">0 / 30</span>
      </div>
      <div class="hst">
        <span class="hst-l">Generación Total</span>
        <span class="hst-v" id="hs-tot">$0/s</span>
      </div>
      <button id="btn-theme" title="Alternar Tema">☀️</button>
      <button id="btn-exp">⬇ Exportar</button>
      <button id="btn-imp">⬆ Importar</button>
      <input type="file" id="file-imp" accept=".json" style="display: none;">
      <button id="btn-ra">↺ Reset Todo</button>
    </div>
  </header>

  <!-- ───────────────────── APP ───────────────────── -->
  <div id="app">
    <aside id="sb">
      <div class="sec-title c-cyan">Catálogo de Pets</div>
      <div id="dict"></div>
    </aside>
    <div id="sb-resizer"></div>

    <main id="main">
      <div class="sec-title c-purp" style="margin-bottom:1.1rem">Zona de Colocación</div>
      <div id="floors"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
